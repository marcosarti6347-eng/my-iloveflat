<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>원터치 실물 확인 장부 (사진 중심형)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f5f7fb; color: #333; padding: 15px; -webkit-user-select: none; }
        .container { max-width: 500px; margin: 0 auto; }
        h2 { text-align: center; margin-bottom: 15px; color: #1e3a8a; font-size: 1.4rem; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .card-title { font-size: 1.05rem; font-weight: bold; margin-bottom: 15px; color: #4b5563; border-bottom: 2px solid #f3f4f6; padding-bottom: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.9rem; color: #4b5563; margin-bottom: 8px; font-weight: bold; }
        
        input[type="text"] { width: 100%; padding: 15px; border: 3px solid #cbd5e1; border-radius: 8px; font-size: 1.5rem; background: #ffffff; color: #111; font-weight: bold; text-align: center; }
        input[type="text"]:focus { border-color: #2563eb; outline: none; }
        
        #searchStatus { font-size: 1rem; font-weight: bold; text-align: center; margin: 15px 0; min-height: 1.5rem; padding: 8px; border-radius: 6px; }
        .status-found { color: #1e40af; background-color: #eff6ff; }
        .status-new { color: #b91c1c; background-color: #fef2f2; }

        .photo-area { position: relative; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 15px; border: 2px dashed #cbd5e1; border-radius: 12px; background: #fafafa; min-height: 250px; justify-content: center; overflow: hidden; cursor: pointer; }
        .img-preview-large { width: 100%; max-width: 280px; aspect-ratio: 1; border-radius: 12px; object-fit: cover; background: #f3f4f6; border: 1px solid #cbd5e1; }
        
        .btn-register { width: 100%; background-color: #2563eb; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 1.2rem; font-weight: bold; margin-top: 10px; display: none; }
        .btn-register:active { background-color: #1d4ed8; }

        .history-container { max-height: 250px; overflow-y: auto; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #edf2f7; }
        .history-item:last-child { border-bottom: none; }
        .code-tag { background: #eff6ff; color: #1e40af; padding: 4px 8px; border-radius: 6px; font-weight: bold; font-size: 1.3rem; }
        
        button { cursor: pointer; font-weight: bold; }
        .btn-delete { background-color: #ef4444; color: white; border: none; padding: 6px 10px; font-size: 0.85rem; border-radius: 6px; }
        
        .backup-zone { display: flex; gap: 10px; margin-top: 5px; }
        .btn-backup { background-color: #2563eb; color: white; border: none; padding: 12px; border-radius: 8px; flex: 1; font-size: 1rem; }
        .btn-restore { background-color: #4b5563; color: white; border: none; padding: 12px; border-radius: 8px; flex: 1; font-size: 1rem; }
    </style>
</head>
<body>

<div class="container">
    <h2>📸 원터치 실물 확인 장부 (사진 매칭형)</h2>
    
    <div class="card">
        <div class="card-title">📷 1단계: 사진 촬영 및 선택</div>
        <div class="form-group">
            <label>아래 네모 박스를 눌러 사진을 찍거나 선택하세요</label>
            <div class="photo-area" id="photoArea" onclick="triggerCameraInput()">
                <img id="photoPreview" class="img-preview-large" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 24 24' fill='none' stroke='%239ca3af' stroke-width='1'><rect x='3' y='3' width='18' height='18' rx='2' ry='2'/><circle cx='8.5' cy='8.5' r='1.5'/><polyline points='21 15 16 10 5 21'/></svg>">
                <span id="uploadHint" style="font-size:0.9rem; color:#64748b;">눌러서 사진 촬영/파일 선택</span>
            </div>
            <input type="file" id="photoFile" accept="image/*" capture="environment" style="display:none;" onchange="handlePhotoSelected(this)">
        </div>

        <div id="searchStatus">사진을 등록하면 일치하는 코드를 검색합니다.</div>

        <div id="newCodeArea" style="display: none;">
            <div class="form-group">
                <label>✏️ 처음 보는 사진입니다! 매칭할 코드를 입력하세요</label>
                <input type="text" id="productCode" placeholder="숫자 번호 입력">
            </div>
            <button type="button" class="btn-register" id="btnRegister" onclick="saveNewMatch()">📌 이 사진을 이 코드로 등록하기</button>
        </div>
    </div>

    <div class="card">
        <div class="card-title">📋 최근 장부 내역 (사진으로 코드 찾기용)</div>
        <div id="historyList" class="history-container">
            <p style="text-align:center; color:#9ca3af; padding:20px; font-size:0.9rem;">등록된 내역이 없습니다.</p>
        </div>
    </div>

    <div class="card">
        <div class="card-title">💾 핸드폰 교체용 장부 백업/복원</div>
        <div class="backup-zone">
            <button type="button" class="btn-backup" onclick="exportDatabase()">📤 장부 백업하기</button>
            <button type="button" class="btn-restore" onclick="triggerRestoreInput()">📥 장부 가져오기</button>
        </div>
        <input type="file" id="restoreFile" accept=".txt" style="display:none;" onchange="importDatabase(this)">
    </div>
</div>

<script>
    let db = null;
    let currentSelectedPhotoData = null; // 현재 선택된 사진의 데이터 저장용
    
    const request = indexedDB.open("PhotoBasedMatchDB", 1);
    
    request.onupgradeneeded = (e) => {
        db = e.target.result;
        if (!db.objectStoreNames.contains("checks")) {
            // 이번엔 사진 데이터 자체를 조회용 인덱스로 사용 가능하게 설정
            const store = db.createObjectStore("checks", { keyPath: "id", autoIncrement: true });
            store.createIndex("photo", "photo", { unique: false });
        }
    };
    
    request.onsuccess = (e) => { db = e.target.result; loadHistory(); };
    request.onerror = (e) => { alert("장부 시스템 로드 실패. 새로고침 해주세요."); };

    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'ko-KR';
            window.speechSynthesis.speak(msg);
        }
    }

    function triggerCameraInput() { document.getElementById('photoFile').click(); }
    
    // 사진이 촬영되거나 선택되었을 때 실행되는 함수
    function handlePhotoSelected(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const size = 600; // 이미지 압축 사이즈
                    let w = img.width, h = img.height;
                    if (w > h) { h *= size/w; w = size; } else { w *= size/h; h = size; }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    
                    // 최종 압축된 이미지 데이터
                    currentSelectedPhotoData = canvas.toDataURL('image/jpeg', 0.8);
                    
                    // 화면에 미리보기 표시
                    document.getElementById('photoPreview').src = currentSelectedPhotoData;
                    document.getElementById('uploadHint').style.display = "none";
                    
                    // 장부에서 이 사진과 똑같은 사진이 있는지 검색 시작
                    searchPhoto(currentSelectedPhotoData);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    // 사진 데이터로 코드를 찾아내는 함수
    function searchPhoto(photoData) {
        const status = document.getElementById('searchStatus');
        const newCodeArea = document.getElementById('newCodeArea');
        const btnRegister = document.getElementById('btnRegister');
        
        if (!db) return;

        const transaction = db.transaction("checks", "readonly");
        const store = transaction.objectStore("checks");
        const index = store.index("photo");
        const req = index.get(photoData); // 사진 데이터로 검색

        req.onsuccess = () => {
            if (req.result) {
                // 이미 등록된 똑같은 사진을 찾은 경우
                status.className = "status-found";
                status.innerHTML = `📢 찾았다! 이 사진의 코드는 <span style="font-size:1.4rem; color:red;">[${req.result.code}]</span> 입니다.`;
                newCodeArea.style.display = "none";
                speak(`해당 사진의 코드는 ${req.result.code} 번입니다.`);
            } else {
                // 처음 보는 사진인 경우 -> 코드를 새로 등록할 수 있게 창을 열어줌
                status.className = "status-new";
                status.innerText = "❓ 처음 보는 사진입니다. 아래에 이 사진의 코드를 입력해 등록하세요.";
                newCodeArea.style.display = "block";
                btnRegister.style.display = "block";
                document.getElementById('productCode').value = "";
                document.getElementById('productCode').focus();
            }
        };
    }

    // 새로운 사진과 코드를 세트로 장부에 저장하는 함수
    function saveNewMatch() {
        const codeField = document.getElementById('productCode');
        const code = codeField.value.trim();
        
        if (!code) { alert("코드를 입력하셔야 장부에 등록할 수 있습니다."); codeField.focus(); return; }
        if (!currentSelectedPhotoData) { alert("사진이 없습니다. 다시 촬영해주세요."); return; }

        const tx = db.transaction("checks", "readwrite");
        tx.objectStore("checks").add({ 
            code: code, 
            photo: currentSelectedPhotoData, 
            date: new Date().toLocaleString('ko-KR') 
        });
        
        tx.oncomplete = () => {
            alert(`사진이 코드 [${code}] 번으로 장부에 등록되었습니다!`);
            document.getElementById('newCodeArea').style.display = "none";
            document.getElementById('photoFile').value = "";
            loadHistory();
            
            // 검색 상태 업데이트
            const status = document.getElementById('searchStatus');
            status.className = "status-found";
            status.innerHTML = `📢 등록 완료! 이 사진의 코드는 <span style="font-size:1.4rem; color:red;">[${code}]</span> 입니다.`;
        };
    }

    // 아래쪽 장부 목록 출력
    function loadHistory() {
        if (!db) return;
        const store = db.transaction("checks", "readonly").objectStore("checks");
        const list = document.getElementById('historyList');
        list.innerHTML = '';
        let count = 0;
        
        store.openCursor(null, "prev").onsuccess = (e) => {
            const cursor = e.target.result;
            if (cursor) {
                count++;
                const item = cursor.value;
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <div style="display:flex; align-items:center; gap:12px;">
                        <img src="${item.photo}" style="width:65px; height:65px; border-radius:6px; object-fit:cover; border:1px solid #ddd;">
                        <div>
                            <span style="font-size:0.8rem; color:#666;">이 사진의 코드는?</span><br>
                            <span class="code-tag">${item.code}</span>
                            <br><small style="color:#aaa; font-size:0.7rem;">${item.date}</small>
                        </div>
                    </div>
                    <button type="button" class="btn-delete" onclick="deleteItem(${item.id})">삭제</button>
                `;
                list.appendChild(div);
                cursor.continue();
            } else if (count === 0) {
                list.innerHTML = '<p style="text-align:center; color:#9ca3af; padding:20px; font-size:0.9rem;">등록된 내역이 없습니다.</p>';
            }
        };
    }

    function deleteItem(id) {
        if (confirm("이 등록 내역을 삭제하시겠습니까?")) {
            const tx = db.transaction("checks", "readwrite");
            tx.objectStore("checks").delete(id);
            tx.oncomplete = () => {
                loadHistory();
                resetUI();
            };
        }
    }

    function resetUI() {
        document.getElementById('photoPreview').src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 24 24' fill='none' stroke='%239ca3af' stroke-width='1'><rect x='3' y='3' width='18' height='18' rx='2' ry='2'/><circle cx='8.5' cy='8.5' r='1.5'/><polyline points='21 15 16 10 5 21'/></svg>";
        document.getElementById('uploadHint').style.display = "block";
        document.getElementById('searchStatus').innerText = "사진을 등록하면 일치하는 코드를 검색합니다.";
        document.getElementById('searchStatus').className = "";
        document.getElementById('newCodeArea').style.display = "none";
        currentSelectedPhotoData = null;
    }

    // 백업 기능
    function exportDatabase() {
        if (!db) return;
        const store = db.transaction("checks", "readonly").objectStore("checks");
        const allData = [];

        store.openCursor().onsuccess = (e) => {
            const cursor = e.target.result;
            if (cursor) {
                allData.push({ code: cursor.value.code, photo: cursor.value.photo, date: cursor.value.date });
                cursor.continue();
            } else {
                if (allData.length === 0) { alert("백업할 장부 데이터가 없습니다."); return; }
                const jsonString = JSON.stringify(allData);
                const blob = new Blob([jsonString], { type: "text/plain;charset=utf-8" });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = "photo_장부_백업.txt";
                link.click();
                alert("장부 전체가 'photo_장부_백업.txt' 파일로 저장되었습니다.");
            }
        };
    }

    function triggerRestoreInput() { document.getElementById('restoreFile').click(); }

    // 복원 기능
    function importDatabase(input) {
        if (!input.files || !input.files[0]) return;
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const importedData = JSON.parse(e.target.result);
                if (!Array.isArray(importedData)) { alert("올바른 파일이 아닙니다."); return; }
                if (confirm(`현재 장부를 비우고 백업 데이터 [${importedData.length}개]로 덮어씁니까?`)) {
                    const tx = db.transaction("checks", "readwrite");
                    const store = tx.objectStore("checks");
                    store.clear().onsuccess = () => {
                        importedData.forEach((item, index) => {
                            store.add({ id: index + 1, code: item.code, photo: item.photo, date: item.date });
                        });
                    };
                    tx.oncomplete = () => { alert("장부가 완벽하게 복원되었습니다!"); loadHistory(); resetUI(); };
                }
            } catch (err) { alert("파일 읽기 오류가 발생했습니다."); }
        };
        reader.readAsText(file);
    }
</script>
</body>
</html>
